[project]
name = "aegis-forkguard"
version = "0.1.0"
description = "Counterfactual execution firewall for AI agents built with Jaclang"
authors = ["JacHacks SF 2026 Team"]
readme = "README.md"
license = "MIT"

[dependencies]
jaclang = ">=0.16.7"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[serve]
port = 8000
host = "0.0.0.0"
client = true

[plugins.client]
dir = "frontend"
