[project]
name = "aegis-forkguard"
version = "1.0.0"
description = "ForkGuard: a counterfactual pre-execution firewall for AI agents, built in Jaclang"
authors = ["JacHacks SF 2026 Team"]
readme = "README.md"
license = "MIT"

[dependencies]
jaclang = ">=0.16.7"

[serve]
port = 8000
host = "127.0.0.1"

[test]
directory = "tests"

[scripts]
# One command that gates the whole submission: type check -> lint -> tests ->
# real end-to-end demo -> language mix. Non-zero exit on any failure.
build = "jac run build.jac"
demo = "jac run main.jac"
serve = "jac start main.jac"
test = "jac test tests/forkguard_tests.jac"
